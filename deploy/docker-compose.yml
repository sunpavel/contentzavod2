# Изолированный контент-завод — отдельный контейнер рядом с n8n (не пересекается с ним).
# Запуск на сервере (из корня репозитория):
#   cp .env.example .env   # вписать ключи
#   docker compose -f deploy/docker-compose.yml up -d --build
#   docker compose -f deploy/docker-compose.yml logs -f
services:
  factory:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: foodgenius-factory
    container_name: foodgenius-factory
    restart: unless-stopped
    env_file:
      - ../.env            # ключи приходят сюда, в образ НЕ зашиты
    environment:
      - TZ=Europe/Moscow
      - REMOTION_RENDER_FLAGS=--gl=swiftshader
    volumes:
      - ../logs:/app/logs  # логи слотов на хост (плюс docker logs)
