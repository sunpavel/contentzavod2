# ============================================================
#  CHANNEL DNA — «конституция» канала
#  Подмешивается во ВСЕ промпты (тренды, сценарии, тексты).
#  Меняешь здесь — меняется тон всего завода.
#  Загружается воркфлоу WF2/WF4 (нода "Load DNA").
# ============================================================

product:
  name: FoodGenius AI
  what: AI-план питания на неделю + автоматический список покупок прямо в Telegram
  bot: "@foodgenius_ai_bot"
  url: https://foodgenius-ai-production.up.railway.app
  # боли, которые продукт закрывает — на них строим контент
  pains:
    - "каждый день мучаешься вопросом «что приготовить?»"
    - "тратишь время на составление списка покупок"
    - "хочешь питаться разнообразно/полезно, но нет времени планировать"
    - "покупаешь лишнее, продукты портятся, деньги на ветер"

niche: быстрое и полезное питание без заморочек (meal-prep, планирование, экономия)

audience:
  who: занятые люди 25–40, родители, худеющие, те кто устал думать о еде
  speaks_to: "ты, кто хочет нормально питаться, но не хочет на это тратить полжизни"

goal: рост подписчиков + переходы в Telegram-бота (конверсия в пользователя продукта)

tone:
  voice: дружелюбный, практичный, на «ты», лайфхак-стиль, без занудства и морализаторства
  avoid: [медицинские обещания, «волшебные диеты», сложные термины, душнила-тон]

# Проверенные форматы под вертикальное видео (Shorts/Reels/Threads)
formats:
  - id: what_to_cook
    name: "Что приготовить за N минут из M продуктов"
  - id: week_plan_demo
    name: "План питания на неделю за 30 секунд (демо бота)"
  - id: one_set_three_meals
    name: "3 ужина из одного набора продуктов"
  - id: budget_week
    name: "Сколько стоит здоровая неделя (бюджет-хук)"
  - id: grocery_list
    name: "Список покупок на неделю, который не выкинешь"
  - id: food_hack
    name: "Фуд-лайфхак / подмена вредного на полезное"
  - id: asmr_cook
    name: "Таймлапс/ASMR готовки + AI b-roll"

# Библиотека хук-паттернов (первые 1–3 сек решают всё)
hook_patterns:
  - "Хватит думать что приготовить — вот {результат}"
  - "Твой план питания на неделю за 10 секунд"
  - "{Число} ужина из одного набора продуктов за {сумма}₽"
  - "Я перестал выкидывать продукты, когда начал делать так:"
  - "Здоровая неделя за {сумма}₽ — список ниже"

cta:
  text: "AI соберёт тебе план питания и список покупок — бот в профиле"
  short: "план питания → бот в шапке"

# Технические рамки ролика
format_spec:
  aspect: "9:16"
  resolution: "1080x1920"
  duration_sec: [15, 45]
  subtitles: true        # always burned-in
  brand_color: "#1DB954" # placeholder — заменить на фирменный
  outro_cta: true        # последние 2–3 сек — экран с CTA на бота
