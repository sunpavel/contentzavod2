# ============================================================
#  CHANNEL DNA — «конституция» канала
#  Подмешивается во ВСЕ промпты (тренды, сценарии, тексты).
#  Меняешь здесь — меняется тон и стратегия всего завода.
#  Загружается воркфлоу WF1/WF2/WF4 (нода "Channel DNA").
# ============================================================

product:
  name: FoodGenius AI
  what: AI-план питания на неделю + автоматический список покупок прямо в Telegram
  bot: "@foodgenius_ai_bot"
  url: https://foodgenius-ai-production.up.railway.app
  pains:
    - "ешь одно и то же — гречка/макароны по кругу, надоело"
    - "не знаешь что приготовить → опять заказал доставку, слил деньги"
    - "купил продукты, забыл, выкинул — деньги в мусор"
    - "нет времени планировать и считать список покупок"
    - "хочешь питаться полезно/разнообразно, но это кажется дорого и сложно"

niche: быстрое и полезное питание без заморочек (планирование, экономия, антифудвейст)

audience:
  who: занятые люди 25–40, родители, худеющие, те кто устал думать о еде
  speaks_to: "ты, кто хочет нормально питаться, но не хочет тратить на это полжизни"

goal: рост аудитории + переходы в Telegram-бота (конверсия в пользователя продукта)

tone:
  voice: дружелюбный, практичный, на «ты», лайфхак-стиль, без занудства
  avoid: [медицинские обещания, «волшебные диеты», сложные термины, душнила-тон]

# ── СТРАТЕГИЯ (нельзя продавать в каждом ролике) ──────────────
content_strategy:
  principle: >
    Боль/польза в первые 3 секунды (читается без звука). Демо приложения —
    как решение, а не как реклама. Save-триггер в конце. Конкретные цифры/время.
  # Распределение по воронке (правило ~70/20/10)
  buckets:
    reach:    { share: 0.60, goal: "досмотры + репосты + новая аудитория", product: "почти не виден" }
    trust:    { share: 0.25, goal: "сохранения + подписка + прогрев",      product: "контекстно" }
    convert:  { share: 0.15, goal: "клик в бота",                           product: "в центре — демо" }

# ── ПОРТФЕЛЬ АРХЕТИПОВ (WF1 ротирует по weight, WF6 усиливает победителей) ──
scenarios:
  - { id: pain_demo,    bucket: convert, weight: 3, name: "Боль → НАДОЕЛО → демо app",  hook: "Гречка. Опять. Надоело?",                product_role: "центр (скринкаст)" }
  - { id: feature_demo, bucket: convert, weight: 2, name: "Чистое демо фичи",           hook: "План на неделю за 10 секунд",            product_role: "центр" }
  - { id: comparison,   bucket: convert, weight: 1, name: "Сравнение/сплит",            hook: "Доставка 850₽ vs план 1500₽ на неделю",  product_role: "решение" }
  - { id: listicle,     bucket: reach,   weight: 3, name: "Листикл-сохраняшка",         hook: "5 ужинов до 200₽ — сохраняй",            product_role: "мягко в конце" }
  - { id: pov_relatable,bucket: reach,   weight: 3, name: "POV / relatable",            hook: "POV: открыл холодильник 5-й раз",        product_role: "не виден" }
  - { id: meme_trend,   bucket: reach,   weight: 2, name: "Мем / тренд-джек",           hook: "боль еды на актуальный звук",            product_role: "не виден" }
  - { id: lifehack,     bucket: reach,   weight: 2, name: "Лайфхак-польза",             hook: "Готовлю раз — ем 3 дня",                 product_role: "мягко" }
  - { id: build_public, bucket: trust,   weight: 2, name: "Building in public",         hook: "Учим бота понимать 'что-нибудь без лука'", product_role: "герой истории" }
  - { id: myth_edu,     bucket: trust,   weight: 2, name: "Миф / educational",          hook: "ПП — это дорого? Считаем",               product_role: "доказательство" }
  - { id: social_proof, bucket: trust,   weight: 1, name: "Social proof / UGC",         hook: "Вы прислали — бот собрал",               product_role: "пруф" }
  - { id: before_after, bucket: trust,   weight: 1, name: "До / после",                 hook: "Холодильник до и после плана",           product_role: "результат" }
  - { id: seasonal,     bucket: reach,   weight: 1, name: "Сезон / повод",              hook: "Обеды на работу на неделю",              product_role: "по ситуации" }

# ── ХУК-ФОРМУЛЫ (проверенные, первые 0–3 сек) ──
hook_patterns:
  transformation: "Смотри как {плохо} превращается в {вау-результат}"
  controversy:    "Меня засмеют, но я планирую еду вот так…"
  problem_solution: "Ты тратишь {сумма} на доставку, потому что не знаешь что готовить"
  shock_number:   "Неделя нормальной еды — {сумма}₽. Список ниже"
  pov:            "POV: пришёл с работы — а план ужина уже готов"
  results_first:  "Это план на неделю за 10 секунд — показываю как"
  repetition_pain: "{еда}. Опять {еда}. Надоело?"

# Триггеры на сохранение (saves — топ-сигнал для фуда)
save_triggers:
  - "Сохрани, чтоб не есть одно и то же"
  - "Сохрани перед следующей доставкой"
  - "Сохрани, чтоб не выкидывать продукты снова"
  - "Сохрани — пригодится в воскресенье на закупке"

# Building in public — отдельный пласт доверия (тактика Sizzle: +100k за 2.5 мес)
building_in_public: >
  Открыто показываем как развивается бот: новые фичи, как AI учится, честные цифры.
  Прозрачность растит доверие и даёт почти бесплатный вирусный контент.

# ── ИСТОЧНИКИ ДЛЯ VIRAL MINING (WF1) ──
# Откуда майним вирусных победителей. Клонируем ФОРМУЛУ, не контент.
viral_mining:
  competitor_accounts:        # аккаунты конкурентов (фуд/meal-planning/рецепты)
    - "COMPETITOR_1"
    - "COMPETITOR_2"
  hashtags:
    - "чтоприготовить"
    - "планпитания"
    - "mealprep"
    - "быстрыерецепты"
    - "экономиянаеде"
  filters:
    min_likes: 1000           # порог вовлечённости
    max_age_days: 21          # только свежее
    top_n: 10                 # сколько победителей в день
  relevance_gate: >
    LLM отсеивает ролики, которые не ложатся на нишу или куда нельзя органично
    вшить продукт. Каждому победителю проставляется mapped_archetype из scenarios.

cta:
  text: "AI соберёт тебе план питания и список покупок — бот в профиле"
  short: "план питания → бот в шапке"

# Технические рамки ролика
format_spec:
  aspect: "9:16"
  resolution: "1080x1920"
  duration_sec: [12, 30]      # короче = выше досматриваемость
  no_sound_readable: true     # текст на экране в первом кадре обязателен
  subtitles: true
  brand_color: "#1DB954"      # placeholder — заменить на фирменный
  outro_cta: true             # последние 1–2 сек — экран с CTA на бота
