# ============================================================
#  Postiz (self-host) — публикация на соцсети, опенсорс, $0
#  Поднимать ОТДЕЛЬНО от n8n (свой домен + HTTPS-reverse-proxy).
#  Замени домен/секреты. Полный список env и OAuth провайдеров — docs.postiz.com.
# ============================================================
services:
  postiz:
    image: ghcr.io/gitroomhq/postiz-app:latest
    restart: always
    environment:
      MAIN_URL: "https://postiz.ТВОЙ-ДОМЕН"
      FRONTEND_URL: "https://postiz.ТВОЙ-ДОМЕН"
      NEXT_PUBLIC_BACKEND_URL: "https://postiz.ТВОЙ-ДОМЕН/api"
      JWT_SECRET: "СМЕНИ_НА_ДЛИННУЮ_СЛУЧАЙНУЮ_СТРОКУ"
      DATABASE_URL: "postgresql://postiz:postiz@postiz-postgres:5432/postiz"
      REDIS_URL: "redis://postiz-redis:6379"
      BACKEND_INTERNAL_URL: "http://localhost:3000"
      IS_GENERAL: "true"
      STORAGE_PROVIDER: "local"
      UPLOAD_DIRECTORY: "/uploads"
      NEXT_PUBLIC_UPLOAD_DIRECTORY: "/uploads"
      # OAuth провайдеров — добавляй по мере подключения площадок (см. docs.postiz.com):
      # TIKTOK_CLIENT_ID / TIKTOK_CLIENT_SECRET
      # INSTAGRAM_APP_ID / INSTAGRAM_APP_SECRET
      # YOUTUBE_CLIENT_ID / YOUTUBE_CLIENT_SECRET
      # X_API_KEY / X_API_SECRET ...
    ports:
      - "5000:5000"
    volumes:
      - postiz-uploads:/uploads
    depends_on:
      - postiz-postgres
      - postiz-redis

  postiz-postgres:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: postiz
      POSTGRES_PASSWORD: postiz
      POSTGRES_DB: postiz
    volumes:
      - postiz-pg:/var/lib/postgresql/data

  postiz-redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - postiz-redis-data:/data

volumes:
  postiz-uploads:
  postiz-pg:
  postiz-redis-data:
